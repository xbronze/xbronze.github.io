<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
<style>
.t { fill: #171717; font: 400 14px/20px "PingFang SC", "Microsoft YaHei", sans-serif; }
.th { fill: #171717; font: 500 14px/20px "PingFang SC", "Microsoft YaHei", sans-serif; }
.ts { fill: #52525B; font: 400 12px/18px "PingFang SC", "Microsoft YaHei", sans-serif; }
.arr { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
g.c-neutral > rect, g.c-neutral > circle { fill: #F7F7F8; stroke: rgba(23,23,23,0.12); }
g.c-brand > rect { fill: #E5FFF2; stroke: #0FDC78; }
.c-brand > .th, .c-brand > .ts { fill: #004D26; }
.rule-pill { fill: #EFEFF2; }
</style>
<rect width="720" height="380" fill="#FFFFFF"/>
<defs>
<marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
<path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
</marker>
</defs>
<g class="c-neutral">
<rect x="40" y="158" width="88" height="44" rx="22"/>
<text class="t" x="84" y="185" text-anchor="middle">PSK信号</text>
</g>
<path class="arr" d="M128,180 L172,180" marker-end="url(#arr)"/>
<g class="c-neutral">
<rect x="176" y="158" width="96" height="44" rx="8"/>
<text class="th" x="224" y="176" text-anchor="middle">带通滤波器</text>
<text class="ts" x="224" y="192" text-anchor="middle">限带降噪</text>
</g>
<path class="arr" d="M272,180 L296,180" marker-end="url(#arr)"/>
<g class="c-neutral">
<circle cx="318" cy="180" r="18"/>
<text class="th" x="318" y="185" text-anchor="middle">×</text>
</g>
<path class="arr" d="M336,180 L378,180" marker-end="url(#arr)"/>
<g class="c-neutral">
<rect x="382" y="158" width="96" height="44" rx="8"/>
<text class="th" x="430" y="176" text-anchor="middle">低通滤波器</text>
<text class="ts" x="430" y="192" text-anchor="middle">滤除2倍频项</text>
</g>
<path class="arr" d="M478,180 L518,180" marker-end="url(#arr)"/>
<g class="c-neutral">
<circle cx="556" cy="180" r="34"/>
<text class="th" x="556" y="185" text-anchor="middle">抽样判决</text>
</g>
<text class="ts" x="556" y="232" text-anchor="middle">码元定时抽样</text>
<path class="arr" d="M590,180 L646,180" marker-end="url(#arr)"/>
<text class="t" x="618" y="164" text-anchor="middle">NRZ 输出</text>
<g class="c-brand">
<rect x="228" y="262" width="180" height="40" rx="8"/>
<text class="th" x="318" y="280" text-anchor="middle">本地相干载波</text>
<text class="ts" x="318" y="296" text-anchor="middle">cosωct · 严格同频同相</text>
</g>
<path class="arr" d="M318,262 L318,202" marker-end="url(#arr)"/>
<text class="ts" x="360" y="330" text-anchor="middle">注意：载波恢复存在 0°/180° 不确定性——本地载波一旦倒相，0 与 1 整体颠倒（相位模糊）</text>
<rect class="rule-pill" x="230" y="344" width="260" height="26" rx="13"/>
<text class="ts" x="360" y="361" text-anchor="middle">u &gt; 0 → 判 1，u &lt; 0 → 判 0</text>
</svg>
