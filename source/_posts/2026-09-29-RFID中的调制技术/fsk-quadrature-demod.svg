<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
<style>
.t { fill: #171717; font: 400 14px/20px "PingFang SC", "Microsoft YaHei", sans-serif; }
.th { fill: #171717; font: 500 14px/20px "PingFang SC", "Microsoft YaHei", sans-serif; }
.ts { fill: #52525B; font: 400 12px/18px "PingFang SC", "Microsoft YaHei", sans-serif; }
.arr { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
g.c-neutral > rect, g.c-neutral > circle { fill: #F7F7F8; stroke: rgba(23,23,23,0.12); }
g.c-brand > rect { fill: #E5FFF2; stroke: #0FDC78; }
.c-brand > .th, .c-brand > .ts { fill: #004D26; }
.result { fill: #004D26; font: 500 14px/20px "PingFang SC", "Microsoft YaHei", sans-serif; }
.panel { fill: #EFEFF2; }
</style>
<rect width="720" height="340" fill="#FFFFFF"/>
<defs>
<marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
<path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
</marker>
</defs>
<text class="ts" x="40" y="30">以 f₁ 通道为例（发 f₁ 时 s(t) = A·cos(ω₁t+θ)，θ 为随机相位）</text>
<text class="ts" x="40" y="56">s(t)</text>
<path class="arr" d="M40,66 L222,66" marker-end="url(#arr)"/>
<path class="arr" d="M110,66 L110,146 L222,146" marker-end="url(#arr)"/>
<g class="c-neutral">
<circle cx="240" cy="66" r="16"/>
<text class="th" x="240" y="71" text-anchor="middle">×</text>
</g>
<text class="ts" x="240" y="98" text-anchor="middle">cosω₁t</text>
<path class="arr" d="M256,66 L296,66" marker-end="url(#arr)"/>
<g class="c-neutral">
<rect x="300" y="44" width="96" height="44" rx="8"/>
<text class="th" x="348" y="71" text-anchor="middle">低通滤波器</text>
</g>
<text class="t" x="428" y="71">(A/2)·cosθ</text>
<g class="c-neutral">
<circle cx="240" cy="146" r="16"/>
<text class="th" x="240" y="151" text-anchor="middle">×</text>
</g>
<text class="ts" x="240" y="178" text-anchor="middle">sinω₁t</text>
<path class="arr" d="M256,146 L296,146" marker-end="url(#arr)"/>
<g class="c-neutral">
<rect x="300" y="124" width="96" height="44" rx="8"/>
<text class="th" x="348" y="151" text-anchor="middle">低通滤波器</text>
</g>
<text class="t" x="428" y="151">(A/2)·sinθ</text>
<path class="arr" d="M512,66 L566,98" marker-end="url(#arr)"/>
<path class="arr" d="M512,146 L566,114" marker-end="url(#arr)"/>
<g class="c-brand">
<rect x="570" y="84" width="104" height="44" rx="8"/>
<text class="th" x="622" y="102" text-anchor="middle">平方相加</text>
<text class="ts" x="622" y="118" text-anchor="middle">(·)² + (·)²</text>
</g>
<text class="result" x="622" y="158" text-anchor="middle">u₁ = A/2</text>
<text class="ts" x="622" y="178" text-anchor="middle">与 θ 无关</text>
<rect class="panel" x="90" y="214" width="540" height="84" rx="8"/>
<text class="t" x="360" y="246" text-anchor="middle">(A/2)²·cos²θ + (A/2)²·sin²θ = (A/2)²·(cos²θ + sin²θ) = (A/2)²</text>
<text class="ts" x="360" y="272" text-anchor="middle">cos²θ + sin²θ = 1：无论相位 θ 为何值，输出恒为 A/2</text>
<text class="ts" x="360" y="322" text-anchor="middle">f₂ 通道结构相同；发 f₁ 时 u₁ = A/2、u₂ ≈ 0 → 判 1，发 f₂ 时反之</text>
</svg>
