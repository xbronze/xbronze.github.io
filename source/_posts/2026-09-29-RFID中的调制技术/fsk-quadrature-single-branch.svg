<text class="ts" x="98" y="262">乘积波形（直流+高频）</text>
<line class="dcline" x1="280" y1="258" x2="302" y2="258"/>
<text class="ts" x="308" y="262">直流分量 (A/2)·cosθ = 0.25</text>
