<text class="ts" x="380" y="330" text-anchor="middle">低通滤波器：滤掉 2ω₁ 高频，留下直流</text>

<line class="zline" x1="70" y1="384" x2="690" y2="384"/>
<text class="ts" x="60" y="388" text-anchor="end">0</text>
<line class="uline" x1="70" y1="344" x2="690" y2="344"/>
<text class="ulab" x="688" y="336" text-anchor="end">u = (A/2)·cos60° = 0.25</text>

<text class="ts warn" x="380" y="418" text-anchor="middle">θ 随信道随机变化：θ=0° 时输出 A/2，θ=90° 时输出 0 —— 单路输出不可靠</text>
