<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
<style>
.th { fill: #171717; font: 500 16px/24px "PingFang SC", "Microsoft YaHei", sans-serif; }
.t { fill: #171717; font: 400 14px/20px "PingFang SC", "Microsoft YaHei", sans-serif; }
.ts { fill: #52525B; font: 400 12px/18px "PingFang SC", "Microsoft YaHei", sans-serif; }
.ripple { stroke: #171717; stroke-width: 1.2; fill: none; }
.dcline { stroke: #02743B; stroke-width: 2.5; }
.zline { stroke: #52525B; stroke-width: 1; stroke-dasharray: 4 4; }
.uline { stroke: #0FDC78; stroke-width: 2.5; }
.arr { stroke: #52525B; stroke-width: 1.5; stroke-linecap: round; fill: none; }
.ulab { fill: #004D26; font: 500 12px/18px "PingFang SC", "Microsoft YaHei", sans-serif; }
.warn { fill: #E8463A; }
</style>
<rect width="720" height="430" fill="#FFFFFF"/>
<defs>
<marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
<path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
</marker>
</defs>
<text class="th" x="380" y="28" text-anchor="middle">单路相乘：乘积 = 直流 + 高频，低通后只剩直流</text>
<text class="ts" x="380" y="48" text-anchor="middle">以 A=1、θ=60° 为例：s(t)·cos(ω₁t) = 0.25 + 0.5·cos(2ω₁t+60°)</text>

