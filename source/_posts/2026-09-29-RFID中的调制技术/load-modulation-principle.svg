<text class="t" x="321" y="310" text-anchor="middle">负载开关 Z_L</text>

<text class="ts" x="200" y="345" text-anchor="middle">开关闭合 → Z_L接入 → 反射阻抗增大 → 电压幅度下降；断开 → 回升</text>

