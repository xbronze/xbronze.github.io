<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
<style>
.t { fill: #171717; font: 400 14px/20px "PingFang SC", "Microsoft YaHei", sans-serif; }
.th { fill: #171717; font: 500 14px/20px "PingFang SC", "Microsoft YaHei", sans-serif; }
.ts { fill: #52525B; font: 400 12px/18px "PingFang SC", "Microsoft YaHei", sans-serif; }
.coil { fill: none; stroke: #52525B; stroke-width: 1.4; }
.flow { fill: none; stroke: #0FDC78; stroke-width: 1.5; stroke-dasharray: 6 7; stroke-linecap: round; }
.wire { stroke: #52525B; stroke-width: 1.4; fill: none; stroke-linecap: round; }
.box { fill: #F7F7F8; stroke: rgba(23,23,23,0.12); stroke-width: 1.2; }
.carrier { fill: none; stroke: #0FDC78; stroke-width: 1.6; stroke-linejoin: round; }
.env { stroke: #52525B; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
.nrz { stroke: #171717; stroke-width: 2; fill: none; }
</style>
<rect width="720" height="360" fill="#FFFFFF"/>
<defs>
<marker id="garr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
<path d="M1 1 L7 4 L1 7 Z" fill="#0FDC78"/>
</marker>
<marker id="narr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
<path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/>
</marker>
</defs>

<text class="th" x="40" y="34">负载调制：标签不发射，靠改变负载让阅读器电压产生起伏</text>

<ellipse class="coil" cx="110" cy="150" rx="48" ry="72"/>
