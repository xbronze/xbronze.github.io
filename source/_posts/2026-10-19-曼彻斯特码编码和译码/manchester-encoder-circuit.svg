<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
<style>
.th { fill: #171717; font: 600 14px/20px "PingFang SC", "Microsoft YaHei", sans-serif; }
.ts { fill: #52525B; font: 400 12px/18px "PingFang SC", "Microsoft YaHei", sans-serif; }
.wire { stroke: #171717; stroke-width: 1.6; fill: none; stroke-linejoin: round; }
.box { fill: #FFFFFF; stroke: #171717; stroke-width: 1.6; }
.gbox { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.6; }
.dbox { fill: #FEF2F2; stroke: #DC2626; stroke-width: 1.6; }
.lbl { fill: #171717; font: 500 12px/17px "PingFang SC", "Microsoft YaHei", sans-serif; }
.pin { fill: #171717; font: 400 11px/15px "PingFang SC", "Microsoft YaHei", sans-serif; }
.dot { fill: #171717; }
</style>
<rect width="720" height="340" fill="#FFFFFF"/>
<text class="th" x="360" y="24" text-anchor="middle">改进后的曼彻斯特编码电路</text>

<!-- XOR gate 7486 -->
<rect class="gbox" x="150" y="120" width="110" height="80" rx="6"/>
<text class="lbl" x="205" y="148" text-anchor="middle">7486</text>
<text class="lbl" x="205" y="168" text-anchor="middle">异或</text>
<!-- XOR symbol -->
<path class="wire" d="M170,185 Q180,185 188,178 Q180,172 170,172"/>
<path class="wire" d="M192,160 Q182,178 192,196"/>
<path class="wire" d="M196,160 Q186,178 196,196"/>

<!-- NOT gate 7404 -->
<rect class="gbox" x="150" y="230" width="110" height="60" rx="6"/>
<text class="lbl" x="205" y="256" text-anchor="middle">7404</text>
<text class="lbl" x="205" y="274" text-anchor="middle">非门</text>
<path class="wire" d="M168,260 L188,250 L188,270 Z"/>
<circle class="box" cx="194" cy="260" r="3.5"/>

<!-- D flip-flop 74HC74 -->
<rect class="dbox" x="380" y="90" width="180" height="200" rx="8"/>
<text class="lbl" x="470" y="118" text-anchor="middle">74HC74</text>
<text class="lbl" x="470" y="138" text-anchor="middle">D 触发器</text>
<!-- pins labels -->
<text class="pin" x="386" y="170">D</text>
<text class="pin" x="386" y="220">CLK</text>
<text class="pin" x="386" y="270">CL</text>
<text class="pin" x="552" y="170">Q</text>
<text class="pin" x="552" y="270">Q̄</text>
<text class="pin" x="470" y="158" text-anchor="middle">PR</text>
<!-- pin lines -->
<line class="wire" x1="370" y1="166" x2="380" y2="166"/>
<line class="wire" x1="370" y1="216" x2="380" y2="216"/>
<line class="wire" x1="370" y1="266" x2="380" y2="266"/>
<line class="wire" x1="560" y1="166" x2="570" y2="166"/>
<line class="wire" x1="560" y1="266" x2="570" y2="266"/>
<line class="wire" x1="470" y1="90" x2="470" y2="80"/>

<!-- Data input to XOR -->
<line class="wire" x1="80" y1="140" x2="150" y2="140"/>
<text class="ts" x="72" y="144" text-anchor="end">数据</text>
<!-- CLK input to XOR -->
<line class="wire" x1="80" y1="180" x2="150" y2="180"/>
<text class="ts" x="72" y="184" text-anchor="end">CLK</text>

<!-- XOR output to D -->
<line class="wire" x1="260" y1="160" x2="370" y2="166"/>
<circle class="dot" cx="260" cy="160" r="3"/>

<!-- 2CLK to NOT -->
<line class="wire" x1="80" y1="260" x2="150" y2="260"/>
<text class="ts" x="72" y="264" text-anchor="end">2CLK</text>
<!-- NOT output to CLK of FF -->
<line class="wire" x1="260" y1="260" x2="370" y2="216"/>

<!-- CL to Vcc -->
<line class="wire" x1="370" y1="266" x2="340" y2="266"/>
<line class="wire" x1="340" y1="266" x2="340" y2="300"/>
<text class="ts" x="340" y="316" text-anchor="middle">V<tspan baseline-shift="sub" font-size="9">CC</tspan></text>

<!-- PR to encoding control -->
<line class="wire" x1="470" y1="80" x2="470" y2="50"/>
<line class="wire" x1="470" y1="50" x2="620" y2="50"/>
<text class="ts" x="626" y="54">编码控制</text>

<!-- Q output -->
<line class="wire" x1="570" y1="166" x2="640" y2="166"/>
<text class="ts" x="648" y="170">Q</text>
<!-- Qbar output -->
<line class="wire" x1="570" y1="266" x2="660" y2="266"/>
<text class="ts" x="668" y="270">Q̄ (输出)</text>

<!-- note -->
<text class="ts" x="360" y="332" text-anchor="middle">用 D 触发器在 2CLK 反相后的安全沿采样异或输出，滤除尖峰脉冲</text>
</svg>
